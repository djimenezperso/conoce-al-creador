const COLORS={traductor:"--a-traductor",profesor:"--a-profesor",programador:"--a-programador",coach:"--a-coach"};

/* Elegir idioma */
let lang="";
try{lang=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();}catch(e){}
if(!I18N[lang]){const nl=(navigator.language||"es").slice(0,2).toLowerCase(); lang=I18N[nl]?nl:"es";}
const T=I18N[lang];
fmt=n=>new Intl.NumberFormat(T.st.loc).format(n||0);
document.documentElement.lang=lang;
document.title=T.title;
document.getElementById("eyebrow").textContent=T.eyebrow;
document.getElementById("tagline").textContent=T.tagline;
document.getElementById("lblProfile").textContent=T.profile;
document.getElementById("lblMade").textContent=T.made;
document.getElementById("lblApps").textContent=T.apps;

const tabsEl=document.getElementById("tabs");
tabsEl.setAttribute("aria-label",T.profile);
T.order.forEach(k=>{
  const b=document.createElement("button");
  b.className="tab";b.id="tab-"+k;b.type="button";b.setAttribute("role","tab");b.dataset.k=k;
  b.style.setProperty("--c",`var(${COLORS[k]})`);
  b.innerHTML=`<span class="dot"></span>${esc(T.P[k].label)}`;
  b.addEventListener("click",()=>show(k,true));
  tabsEl.appendChild(b);
});

function show(k,user){
  const p=T.P[k]; if(!p) return;
  CUR=k;
  if(p.hl){const [hn,hlab,hs]=p.hl;document.getElementById("hl").innerHTML=`<div class="n">${esc(hn.replace("{n}",p.apps.length))}</div><div class="l">${esc(hlab)}</div><div class="s">${esc(hs)}</div>`;}
  {const el=document.getElementById("hl2");if(p.hl2){const [n2,l2,s2]=p.hl2;el.innerHTML=`<div class="n">${esc(n2)}</div><div class="l">${esc(l2)}</div><div class="s">${esc(s2)}</div>`;el.hidden=false;}else el.hidden=true;}
  const sl=document.getElementById("appsStats"), tot=STATS&&STATS.totals?STATS.totals.pageviews:0;
  sl.hidden=!(tot>0); if(tot>0) sl.innerHTML=T.st.sum(tot);
  document.documentElement.style.setProperty("--accent",`var(${COLORS[k]})`);
  tabsEl.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.k===k));
  document.getElementById("panel").setAttribute("aria-labelledby","tab-"+k);
  document.getElementById("role").textContent=p.role;
  document.getElementById("summary").textContent=p.summary;
  const items=a=>`<div class="items">${a.map(([t,o,w,n])=>`<div class="item"><b>${esc(t)}</b>${w?`<span class="when">${esc(w)}</span>`:""}<span class="org">${esc(o)}</span>${n?`<p class="note" style="margin:4px 0 0">${esc(n)}</p>`:""}</div>`).join("")}</div>`;
  const chips=a=>`<div class="chips">${a.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>`;
  let html="";
  if(p.exp.length) html+=`<div class="block"><h3>${T.h.exp}</h3>${items(p.exp)}</div>`;
  if(p.edu.length) html+=`<div class="block"><h3>${T.h.edu}</h3>${items(p.edu)}</div>`;
  html+=`<div class="block"><h3>${T.h.skills}</h3>${chips(p.skills)}</div>`;
  html+=`<div class="block"><h3>${T.h.langs}</h3>${chips(p.langs)}</div>`;
  document.getElementById("cv").innerHTML=html;
  document.getElementById("apps").innerHTML=p.apps.length?p.apps.map(id=>{
    const [u,i]=APP_URLS[id],[n,d]=T.apps_txt[id];
    const pv=STATS&&STATS.apps&&STATS.apps[id]?STATS.apps[id].pageviews:0;
    const inner=`<span class="ic">${svg(i)}</span><span><b>${esc(n)}</b>${d?`<small>${esc(d)}</small>`:""}${pv>0?`<span class="uses">${T.st.v(pv)} · 30 d</span>`:""}</span>`;
    return u?`<a class="app" href="${u}" target="_blank" rel="noopener">${inner}<span class="go">${svg("arrow")}</span></a>`
            :`<div class="app app-priv">${inner}<span class="tag" title="${esc(T.priv)}">${svg("lock")}<span>${esc(T.priv)}</span></span></div>`;
  }).join(""):`<div class="soon">${esc(T.none)}</div>`;
  let c=`<div><span class="eyebrow">${T.c.email}</span><a href="mailto:${p.email}">${p.email}</a></div>`;
  document.getElementById("contact").innerHTML=c;
  if(user){ try{history.replaceState(null,"",location.search+"#"+k)}catch(e){} }
}

const h=location.hash.slice(1);
show(T.P[h]?h:T.order[0],false);
window.addEventListener("hashchange",()=>{const x=location.hash.slice(1); if(T.P[x]) show(x,false);});
fetch(STATS_URL).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.ok){STATS=d; show(CUR,false);} }).catch(()=>{});

/* Foto de arriba: look elegido hoy por mi app Armario Virtual; el tiempo de hoy, a la derecha */
fetch("https://armario-virtual-one.vercel.app/api/webhook?creador=1").then(r=>r.ok?r.json():null).then(d=>{
  if(!d||!d.ok) return;
  const fdate=f=>{try{return new Date(f+"T12:00:00").toLocaleDateString(T.st.loc,{day:"numeric",month:"short"});}catch(e){return f;}};
  if(d.imagen){
    const im=new Image();
    im.onload=()=>{
      const el=document.getElementById("lookImg");el.src=d.imagen;el.alt=T.lk.alt;
      const b=document.getElementById("lookBadge");b.textContent=d.es_de_hoy?T.lk.live:T.lk.dated(fdate(d.fecha_imagen));b.hidden=false;
      const w=document.getElementById("lookWhy");w.textContent=d.es_de_hoy?T.lk.why:T.lk.why_old;w.hidden=false;
    };
    im.src=d.imagen;
  }
  const t=d.tiempo;
  if(t&&typeof t.temp==="number"){
    const c=document.getElementById("wxCard"), desc=T.lk.wx[t.descripcion]||t.descripcion||"";
    c.innerHTML=`<span class="big" aria-hidden="true">${esc(t.emoji||"")}</span><span class="t">${t.temp}°</span><span class="d">${esc(desc)}<br>${t.max}° / ${t.min}°</span>`;
    c.hidden=false;
  }
}).catch(()=>{});
</script>
