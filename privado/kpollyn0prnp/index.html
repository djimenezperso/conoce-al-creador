<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>María Jesús Rustarazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ficha de laboratorio — foto, nombre y cifras arriba; luego trayectoria en bloques etiquetados */
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --fg:#152024; --muted:#56656A; --line:#D7E0E1;
  --accent:#2C6E69; --accent-soft:#E2EFED;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1617; --surface:#172123; --fg:#E8F0F0; --muted:#9DB0B3; --line:#2A3739; --accent:#6CC3BA; --accent-soft:#1D3533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1617; --surface:#172123; --fg:#E8F0F0; --muted:#9DB0B3; --line:#2A3739; --accent:#6CC3BA; --accent-soft:#1D3533; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:flex;flex-direction:column;gap:36px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.draft{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1.5px dashed var(--line);border-radius:999px;padding:5px 12px}
.langs{display:flex;gap:6px}
.langs button{font:600 13px var(--mono);min-width:44px;min-height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.langs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.langs button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.photo{width:170px;aspect-ratio:3/4;border-radius:20px;overflow:hidden;border:3px solid var(--accent);background:var(--surface)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,5.4vw,56px);line-height:1.02;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.role{font-family:var(--display);font-weight:600;font-size:clamp(18px,2.4vw,24px);color:var(--accent);margin:0 0 12px}
.tagline{margin:0;color:var(--muted);max-width:58ch}
@media (max-width:600px){.hero{grid-template-columns:1fr}.photo{width:140px}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat .n{font:800 40px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat .l{margin-top:8px;font-weight:600;line-height:1.3}
.stat .s{margin-top:4px;font:500 12px var(--mono);color:var(--muted);letter-spacing:.03em}
.gal h2{font-family:var(--display);font-weight:800;font-size:clamp(22px,3vw,30px);margin:6px 0 14px}
.car{position:relative}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.track::-webkit-scrollbar{display:none}
.track figure{flex:0 0 100%;scroll-snap-align:center;margin:0;background:#0B0B0C;border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
@media (max-width:640px){.track figure{flex-basis:88%}}
.track img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:contain;background:#0B0B0C}
.track figcaption{background:var(--surface);padding:12px 16px;font-size:14.5px;line-height:1.4;border-top:1px solid var(--line);margin-top:auto}
.track figcaption b{display:block;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.nav{position:absolute;top:calc((100% - 64px)/2);transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--fg);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center}
.nav.prev{left:10px}.nav.next{right:10px}
.nav:disabled{opacity:0;pointer-events:none}
.nav:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:640px){.nav{display:none}}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer}
.dots button[aria-current="true"]{background:var(--accent);width:24px;border-radius:999px}
.dots button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
.cv{display:flex;flex-direction:column}
.block{border-top:1px solid var(--line);padding-block:20px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
@media (max-width:600px){.block{grid-template-columns:1fr;gap:8px}}
.block h2{margin:2px 0 0;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:16px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px}
.item b{font-weight:600}
.item .org{color:var(--muted);font-size:14.5px}
.item .when{grid-column:2;grid-row:1;font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap;padding-top:3px}
.item ul{grid-column:1/-1;margin:6px 0 0;padding-left:18px;font-size:14.5px}
@media (max-width:420px){.item{grid-template-columns:1fr}.item .when{grid-column:1;grid-row:auto;padding-top:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip.key{background:var(--accent-soft);border-color:transparent;color:var(--fg);font-weight:600}
.contact{border-top:1px solid var(--line);padding-top:22px;display:flex;flex-wrap:wrap;gap:20px 40px}
.contact div{display:flex;flex-direction:column;gap:4px;min-width:0}
.contact span.v{overflow-wrap:anywhere;font-weight:500}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin:0}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(l){
  const t=T[l]; document.documentElement.lang=l;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  for(const id of ["draft","eyebrow","role","tagline","note","galEye","galTitle"]) document.getElementById(id).textContent=t[id];
  document.getElementById("lblEmail").textContent=t.email; document.getElementById("lblCity").textContent=t.cityL; document.getElementById("city").textContent=t.city;
  document.getElementById("grid").innerHTML=t.gal.map(([k,c],i)=>`<figure><img src="${W[i]}" alt="${esc(c)}"><figcaption><b>${esc(k)} · ${i+1}/${t.gal.length}</b>${esc(c)}</figcaption></figure>`).join("");
  document.getElementById("dots").innerHTML=t.gal.map((g,i)=>`<button type="button" aria-label="${i+1}"></button>`).join("");
  document.getElementById("prev").setAttribute("aria-label",{es:"Anterior",fr:"Précédent",en:"Previous"}[l]);
  document.getElementById("next").setAttribute("aria-label",{es:"Siguiente",fr:"Suivant",en:"Next"}[l]);
  slide(0,true);
  document.getElementById("stats").innerHTML=t.stats.map(([n,l,s])=>`<div class="stat"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div><div class="s">${esc(s)}</div></div>`).join("");
  const items=a=>`<div class="items">${a.map(([b,o,w,li])=>`<div class="item"><b>${esc(b)}</b>${w?`<span class="when">${esc(w)}</span>`:""}<span class="org">${esc(o)}</span>${li?`<ul>${li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`).join("")}</div>`;
  const chips=a=>`<div class="chips">${a.map(c=>Array.isArray(c)?`<span class="chip${c[1]?" key":""}">${esc(c[0])}</span>`:`<span class="chip">${esc(c)}</span>`).join("")}</div>`;
  document.getElementById("cv").innerHTML=
    `<div class="block"><h2>${t.h.exp}</h2>${items(t.exp)}</div>`+
    `<div class="block"><h2>${t.h.edu}</h2>${items(t.edu)}</div>`+
    `<div class="block"><h2>${t.h.skills}</h2>${chips(t.skills)}</div>`+
    `<div class="block"><h2>${t.h.langs}</h2>${chips(t.langs)}</div>`+
    `<div class="block"><h2>${t.h.hob}</h2>${chips(t.hob)}</div>`;
  try{localStorage.setItem("mj-lang",l)}catch(e){}
}
const track=document.getElementById("grid");
let cur=0;
function slide(i,instant){
  const figs=track.children; if(!figs.length) return;
  cur=Math.max(0,Math.min(figs.length-1,i));
  const f=figs[cur]; track.scrollTo({left:f.offsetLeft-(track.clientWidth-f.clientWidth)/2,behavior:instant?"auto":"smooth"});
  mark();
}
function mark(){
  [...document.getElementById("dots").children].forEach((d,j)=>d.setAttribute("aria-current",String(j===cur)));
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===track.children.length-1;
}
document.getElementById("prev").addEventListener("click",()=>slide(cur-1));
document.getElementById("next").addEventListener("click",()=>slide(cur+1));
document.getElementById("dots").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) slide([...b.parentNode.children].indexOf(b));});
track.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();slide(cur+1);} if(e.key==="ArrowLeft"){e.preventDefault();slide(cur-1);}});
let st; track.addEventListener("scroll",()=>{clearTimeout(st); st=setTimeout(()=>{
  const c=track.scrollLeft+track.clientWidth/2; let best=0,bd=1e9;
  [...track.children].forEach((f,j)=>{const d=Math.abs(f.offsetLeft+f.clientWidth/2-c); if(d<bd){bd=d;best=j;}});
  cur=best; mark();},80);},{passive:true});
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.l)));
let start="es"; try{const s=localStorage.getItem("mj-lang"); if(T[s]) start=s;}catch(e){}
render(start);
</script>
