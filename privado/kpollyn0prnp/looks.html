<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Elegir look</title>
<style>
:root{--bg:#F3F4F7;--surface:#fff;--fg:#15171E;--muted:#555B6B;--line:#DADDE5;--accent:#17784F}
@media (prefers-color-scheme:dark){:root{--bg:#101218;--surface:#191C24;--fg:#ECEEF3;--muted:#A3A9B8;--line:#2C303B;--accent:#4FCB92;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:24px;margin:0 0 4px}
p{margin:0 0 20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
figure img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--line)}
.n{position:absolute;top:8px;left:8px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--accent);color:#fff;font:700 17px/34px system-ui;text-align:center}
figcaption{padding:8px 10px;font-size:13px;color:var(--muted);line-height:1.35}
figcaption b{display:block;color:var(--fg);font-weight:600}
.msg{padding:20px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Elige tu look fijo</h1>
  <p>Apunta el número del que quieras dejar fijo en tu página. Ninguno gasta créditos: ya están generados.</p>
  <div class="grid" id="grid"><div class="msg">Cargando tus looks…</div></div>
</main>
<script>
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TIPO={hoy:"Día a día",gym:"Gym",fiesta:"Fiesta",playa:"Playa"};
fetch("https://armario-virtual-one.vercel.app/api/webhook?creador_looks=1").then(r=>r.json()).then(d=>{
  const g=document.getElementById("grid");
  if(!d.ok||!d.looks||!d.looks.length){g.innerHTML='<div class="msg">No hay looks con foto (o el armario está en privado).</div>';return;}
  g.innerHTML=d.looks.map((l,i)=>`<figure><img src="${esc(l.imagen)}" alt="Look ${i+1}" loading="lazy"><span class="n">${i+1}</span><figcaption><b>${esc(l.nombre)||"Look"}</b>${esc(TIPO[l.tipo]||l.tipo)} · ${esc(l.fecha)}</figcaption></figure>`).join("");
}).catch(()=>{document.getElementById("grid").innerHTML='<div class="msg">No he podido cargar los looks. Vuelve a intentarlo en un minuto.</div>';});
</script>
</body>
</html>
